# Postgres + Valkey, each with a web viewer.
#   Adminer          http://localhost:8080   (System: PostgreSQL, Server: postgres, User/Pass/DB: demo)
#   Redis Commander  http://localhost:8081   (already pointed at Valkey)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    ports: ["8080:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on: [postgres]

  valkey-viewer:
    image: rediscommander/redis-commander:latest
    ports: ["8081:8081"]
    environment:
      REDIS_HOSTS: "valkey:valkey:6379"
      FOLDING_CHAR: "#"
    depends_on: [valkey]
