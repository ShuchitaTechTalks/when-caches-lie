info:
  name: Proxy chain
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/admin/chain?bean={{mode}}"
  params:
    - name: bean
      value: "{{mode}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
