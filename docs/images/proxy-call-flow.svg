<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/></marker>
    <marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
    <marker id="err" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FB7185"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#0B1220"/>

  <!-- title -->
  <text x="80" y="62" font-size="32" font-weight="700" fill="#FFFFFF">How Spring calls update(): the generated proxy</text>
  <text x="80" y="94" font-size="18" fill="#94A3B8">Demo 1, mode "naive", proxy order tx-outer. Spring Boot builds a CGLIB proxy, a generated subclass of the real class.</text>

  <!-- calling code -->
  <rect x="140" y="120" width="520" height="80" rx="10" fill="#14532D" stroke="#34D399" stroke-width="2"/>
  <text x="160" y="152" font-size="21" font-weight="700" fill="#FFFFFF">Calling code: ProductController</text>
  <text x="160" y="180" font-size="17" font-family="Consolas, 'Courier New', monospace" fill="#BBF7D0">pick("naive").update(1, "Mouse", 999)</text>

  <!-- proxy -->
  <rect x="80" y="240" width="640" height="560" rx="14" fill="#2A1E0A" stroke="#F59E0B" stroke-width="3"/>
  <text x="110" y="276" font-size="23" font-weight="700" fill="#FBBF24">Proxy</text>
  <text x="190" y="276" font-size="17" font-family="Consolas, 'Courier New', monospace" fill="#FDE68A">NaiveProductService$$SpringCGLIB$$0</text>
  <text x="110" y="302" font-size="16" fill="#94A3B8">a generated subclass of NaiveProductService</text>

  <!-- transaction interceptor -->
  <rect x="140" y="330" width="520" height="90" rx="10" fill="#0C2A44" stroke="#38BDF8" stroke-width="2"/>
  <text x="160" y="365" font-size="21" font-weight="700" fill="#FFFFFF">TransactionInterceptor  (outer)</text>
  <text x="160" y="395" font-size="16" fill="#BAE6FD">begins the transaction, commits or rolls back at the end</text>

  <!-- cache interceptor -->
  <rect x="140" y="470" width="520" height="90" rx="10" fill="#0B3B2E" stroke="#34D399" stroke-width="2"/>
  <text x="160" y="505" font-size="21" font-weight="700" fill="#FFFFFF">CacheInterceptor  (inner)</text>
  <text x="160" y="535" font-size="16" fill="#A7F3D0">@CachePut: stores the result after the method returns</text>

  <!-- plain object -->
  <rect x="140" y="660" width="520" height="110" rx="10" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
  <text x="160" y="696" font-size="21" font-weight="700" fill="#FFFFFF">Plain object: NaiveProductService</text>
  <text x="160" y="726" font-size="16" fill="#CBD5E1">update(): sets the name and price</text>
  <text x="160" y="750" font-size="16" fill="#CBD5E1">no SQL yet: Hibernate sends it at commit</text>

  <!-- down arrows (the call goes in) -->
  <line x1="540" y1="200" x2="540" y2="326" stroke="#E2E8F0" stroke-width="3" marker-end="url(#down)"/>
  <line x1="540" y1="420" x2="540" y2="466" stroke="#E2E8F0" stroke-width="3" marker-end="url(#down)"/>
  <line x1="540" y1="560" x2="540" y2="656" stroke="#E2E8F0" stroke-width="3" marker-end="url(#down)"/>

  <!-- up arrows (the result comes out) -->
  <line x1="620" y1="660" x2="620" y2="564" stroke="#94A3B8" stroke-width="3" marker-end="url(#up)"/>
  <line x1="620" y1="470" x2="620" y2="424" stroke="#94A3B8" stroke-width="3" marker-end="url(#up)"/>
  <line x1="620" y1="330" x2="620" y2="204" stroke="#FB7185" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#err)"/>
  <text x="738" y="264" font-size="18" font-weight="700" fill="#FB7185">exception</text>
  <text x="738" y="288" font-size="18" font-weight="700" fill="#FB7185">HTTP 409</text>

  <!-- badges on the arrows and layers -->
  <g font-size="17" font-weight="700" text-anchor="middle" fill="#0B1220">
    <circle cx="578" cy="265" r="15" fill="#E2E8F0"/><text x="578" y="271">1</text>
    <circle cx="578" cy="446" r="15" fill="#E2E8F0"/><text x="578" y="452">2</text>
    <circle cx="578" cy="610" r="15" fill="#E2E8F0"/><text x="578" y="616">3</text>
    <circle cx="690" cy="515" r="15" fill="#FBBF24"/><text x="690" y="521">4</text>
    <circle cx="690" cy="375" r="15" fill="#FB7185"/><text x="690" y="381">5</text>
  </g>

  <!-- right panel: steps -->
  <text x="860" y="146" font-size="27" font-weight="700" fill="#FFFFFF">What happens, in order</text>
  <g font-size="20" fill="#CBD5E1">
    <text x="915" y="196">The controller calls update() on the proxy.</text>
    <text x="915" y="222">The outer layer starts the transaction.</text>
    <text x="915" y="296">The inner layer lets the call through.</text>
    <text x="915" y="366">The real update() runs: the object changes,</text>
    <text x="915" y="392">but no SQL has been sent yet.</text>
    <text x="915" y="462">On the way out, @CachePut writes Mouse 999</text>
    <text x="915" y="488">to Valkey. The commit has not happened yet.</text>
    <text x="915" y="558">The outer layer commits. Postgres refuses</text>
    <text x="915" y="584">(duplicate name) and rolls back, but the</text>
    <text x="915" y="610">cache write cannot be undone.</text>
  </g>
  <g font-size="18" font-weight="700" text-anchor="middle" fill="#0B1220">
    <circle cx="880" cy="190" r="15" fill="#E2E8F0"/><text x="880" y="196">1</text>
    <circle cx="880" cy="290" r="15" fill="#E2E8F0"/><text x="880" y="296">2</text>
    <circle cx="880" cy="360" r="15" fill="#E2E8F0"/><text x="880" y="366">3</text>
    <circle cx="880" cy="456" r="15" fill="#FBBF24"/><text x="880" y="462">4</text>
    <circle cx="880" cy="552" r="15" fill="#FB7185"/><text x="880" y="558">5</text>
  </g>

  <!-- result -->
  <rect x="860" y="650" width="680" height="120" rx="12" fill="#2B0F16" stroke="#FB7185" stroke-width="2"/>
  <text x="884" y="690" font-size="24" font-weight="700" fill="#FB7185">Result: the ghost write</text>
  <text x="884" y="725" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#FFFFFF">Postgres:  Keyboard 100</text>
  <text x="884" y="753" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#FFFFFF">Valkey:    Mouse 999</text>

  <!-- footer -->
  <text x="80" y="848" font-size="17" fill="#94A3B8">A lower order number means the outer layer. Here the transaction layer is outer; in cache-outer mode the two layers swap places.</text>
</svg>
